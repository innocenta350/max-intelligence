[pytest]
# MAX Intelligence — pytest configuration (M1 Stage S0).
# The `live` marker is pre-registered so that M1's gated live-feed tests
# (tests/test_live_feed.py, added in a later stage) never emit an unknown-marker
# warning. They must still be explicitly enabled with LIVE_FEED_TESTS=1.
testpaths = tests
pythonpath = .
markers =
    live: tests that hit the real TriMet feeds; disabled unless LIVE_FEED_TESTS=1 is set
